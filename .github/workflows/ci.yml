name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - name: Syntax check every JS file
        run: git ls-files '*.js' '*.mjs' | xargs -n1 node --check
      - name: Tests (no GitHub calls)
        run: npm test
        env:
          OFFLINE: '1'
